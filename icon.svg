<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb8ff"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
    <mask id="notch">
      <rect x="-400" y="-230" width="800" height="460" rx="56" fill="#fff"/>
      <circle cx="148" cy="-230" r="42" fill="#000"/>
      <circle cx="148" cy="230" r="42" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- Wolken / 구름 -->
  <g fill="#fff" opacity=".55">
    <ellipse cx="210" cy="820" rx="150" ry="52"/><ellipse cx="290" cy="790" rx="90" ry="60"/>
    <ellipse cx="830" cy="210" rx="120" ry="42"/><ellipse cx="770" cy="188" rx="70" ry="46"/>
  </g>
  <!-- Bordkarte / 탑승권 -->
  <g transform="translate(512 520) rotate(-10)">
    <rect x="-400" y="-222" width="800" height="460" rx="56" fill="#13294b" opacity=".18" mask="url(#notch)" transform="translate(10 18)"/>
    <g mask="url(#notch)">
      <rect x="-400" y="-230" width="800" height="460" rx="56" fill="#fff"/>
      <rect x="-400" y="-230" width="548" height="96" fill="#ff6b4a"/>
    </g>
    <!-- Perforation / 점선 -->
    <line x1="148" y1="-170" x2="148" y2="170" stroke="#13294b" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity=".55"/>
    <!-- Flugzeug (Material Symbols "flight") / 비행기 -->
    <g transform="translate(-136 55) rotate(90) scale(13) translate(-12 -12)">
      <path fill="#ff6b4a" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
    </g>
    <!-- Strichcode / 바코드 -->
    <g fill="#13294b">
      <rect x="208" y="-150" width="16" height="300" rx="3"/><rect x="238" y="-150" width="8" height="300" rx="3"/>
      <rect x="260" y="-150" width="22" height="300" rx="3"/><rect x="296" y="-150" width="8" height="300" rx="3"/>
      <rect x="318" y="-150" width="14" height="300" rx="3"/>
    </g>
  </g>
