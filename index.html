<title>여행</title>
<style>
/* Aussehen „Bordkarte“: hellblauer Himmel, weiße Tickets mit Abrisskante und Strichcode, Navy-Schrift, Koralle als Akzent.
   Vergangene Reisen stehen als Einreisestempel auf einer Passseite. Farben je Art: Fahrt lila, Unterkunft blau, Essen orange, Ausflug grün.
   모양 '탑승권': 하늘색 바탕, 절취선·바코드가 있는 흰 탑승권, 남색 글씨, 산호색 포인트. 지난 여행은 여권 페이지의 입국 도장.
   종류별 색: 이동 보라, 숙소 파랑, 맛집 주황, 관광 초록. */
:root {
  --bg: #e7f2ff; --bg-top: #cfe6ff; --brand: #13294b; --brand-2: #0c1c36; --on-brand: #fff; --sheet: #fff; --ink: #13294b; --muted: #687a94; --line: #dbe5f2;
  --field: #f0f5fb; --soft: #e4eefb; --accent: #2a5db0; --sun: #ff6b4a; --sun-ink: #fff; --coral: #ff6b4a; --mint: #13946f; --rail: #b8cbe6;
  --ok: #138a63; --ok-bg: #e0f5ec; --warn: #c2541a; --warn-bg: #fff0e6; --bad: #d23a2c;
  --move: #7a5cd3; --stay: #2f72d6; --food: #e3702f; --cafe: #9a6534; --see: #1d9a64; --shop: #d4457f; --etc: #7b8aa0;
  --move-bg: #efeafc; --stay-bg: #e7f0fd; --food-bg: #fdeee4; --cafe-bg: #f6ece2; --see-bg: #e2f5ec; --shop-bg: #fde8f0; --etc-bg: #eef2f7;
  --shadow: 0 1px 2px rgba(19, 41, 75, .05), 0 6px 18px rgba(19, 41, 75, .08);
  --paper: #fbfdff; --paper-line: #dbe5f2; --paper-ink: #687a94; --paper-head: #13294b;
  --sans: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1730; --bg-top: #102449; --brand: #3d6fd6; --brand-2: #2a56b3; --sheet: #14264a; --ink: #e8eefb; --muted: #9fb0cc; --line: #26395f;
    --field: #1b2f58; --soft: #1a3160; --accent: #93b6ff; --sun: #ff7a5c; --coral: #ff7a5c; --mint: #4fd1a5; --rail: #34507f;
    --ok: #6fdca4; --ok-bg: #173526; --warn: #ffb070; --warn-bg: #3a2818; --bad: #ff7a6b;
    --move: #a68cf0; --stay: #6ea4f5; --food: #f59a5e; --cafe: #d6a676; --see: #4fcf94; --shop: #f07aa8; --etc: #a2b0c4;
    --move-bg: #262040; --stay-bg: #182a44; --food-bg: #3a2416; --cafe-bg: #33261a; --see-bg: #14322a; --shop-bg: #3a1a28; --etc-bg: #1f2a3d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --paper: #14264a; --paper-line: #26395f; --paper-ink: #9fb0cc; --paper-head: #1d3a73;
  }
}
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; }
#app { max-width: 620px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--bg-top), var(--bg) 340px); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 1.2em; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; width: 1em; overflow: hidden;
  white-space: nowrap; direction: ltr; vertical-align: -.22em; -webkit-font-smoothing: antialiased; font-feature-settings: "liga"; font-variation-settings: "FILL" 0, "wght" 450, "GRAD" 0, "opsz" 24; }
.it .ic .ms { font-size: 21px; color: var(--c); font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; vertical-align: 0; }
.it.done .ic .ms { color: var(--muted); }
.icon-btn .ms { font-size: 21px; vertical-align: 0; }
.cats .ms { font-size: 18px; vertical-align: 0; }
.cats input:checked + span .ms { color: inherit; }
.nv { display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; border-radius: 4px; background: #03c75a; color: #fff; font: 900 .8em/1 var(--sans); vertical-align: -.15em; }
.night .ms { font-size: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Kopf / 머리 */
.top { position: relative; padding: calc(12px + env(safe-area-inset-top)) 16px 4px; color: var(--ink); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 40px; border-radius: 50%; font-size: 18px; color: var(--ink); text-decoration: none; }
.top .icon-btn { background: var(--sheet); box-shadow: var(--shadow); }
.back { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--sheet); box-shadow: var(--shadow); font-weight: 700; font-size: 15px; }
.lang { display: flex; gap: 12px; }
.lang button { font-size: 14px; color: var(--muted); padding: 4px 0; border-bottom: 2px solid transparent; }
.lang button.on { color: var(--ink); font-weight: 800; border-bottom-color: var(--coral); }
h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.15; letter-spacing: -.035em; }
.chip-d { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--coral); color: #fff; font-weight: 800; font-size: 14px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 6px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 7px 14px; white-space: nowrap; font-size: 15px; font-weight: 700; border-radius: 999px; background: var(--sheet); color: var(--muted); box-shadow: var(--shadow); }
.tab.on { background: var(--brand); color: #fff; }

/* Inhalt / 내용 */
.sheet { flex: 1; padding: 10px 16px calc(110px + env(safe-area-inset-bottom)); position: relative; }
h2 { margin: 22px 2px 10px; font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .01em; }
h2:first-child { margin-top: 2px; }
.empty { margin: 30px 0; text-align: center; color: var(--muted); }
.banner { margin: 0 0 14px; padding: 11px 14px; border-radius: 14px; background: var(--warn-bg); color: var(--warn); font-size: 15px; font-weight: 600; }

/* Bordkarte / 탑승권 */
.tk { display: block; width: 100%; position: relative; margin: 12px 0 16px; background: var(--sheet); border-radius: 18px; box-shadow: var(--shadow); color: var(--ink); text-align: left; }
.tk-img { display: block; height: 84px; border-radius: 18px 18px 0 0; background: var(--soft) center/cover no-repeat; }
.tk-main { display: block; padding: 14px 16px 10px; }
.air { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 800; color: var(--muted); }
.air span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.air b { flex: none; color: var(--coral); }
.route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; margin: 8px 0 2px; }
.apc { display: block; min-width: 0; font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -.02em; }
.apc small { display: block; margin-top: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route .r { text-align: right; }
.plane { color: var(--coral); font-size: 20px; padding: 0 8px 20px; }
.stub { display: block; position: relative; padding: 12px 16px 14px; border-top: 2px dashed var(--line); }
.stub::before, .stub::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg-top); }
.stub::before { left: -10px; } .stub::after { right: -10px; }
.stub .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 16px; font-weight: 800; }
.stub small { display: block; font: 600 10px var(--mono); letter-spacing: .12em; color: var(--muted); }
.stub .bar { display: block; height: 30px; margin-top: 10px; opacity: .85; border-radius: 2px;
  background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px, var(--ink) 12px 13px, transparent 13px 17px); }
.tk:has(.dday) .air { padding-right: 86px; }
.dday { position: absolute; right: 14px; top: -11px; z-index: 1; padding: 4px 11px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 14px; font-weight: 900; box-shadow: 0 3px 10px rgba(255, 107, 74, .35); }
.tk-head { margin: 14px 0 0; }
.tk-head .apc { font-size: 34px; }
.tk-head .tk-img { height: 64px; }
.trips { display: grid; gap: 8px; }
.stubc { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; background: var(--sheet); border-radius: 14px; border-left: 4px dashed var(--line); box-shadow: var(--shadow); text-align: left; }
.stubc .c { font-size: 19px; font-weight: 900; line-height: 1.1; }
.stubc .c small { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.stubc b { min-width: 0; font-size: 15.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stubc b small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.stubc .d { font-size: 14px; font-weight: 900; color: var(--coral); white-space: nowrap; }

/* Pass mit Stempeln (vergangene Reisen) / 여권 도장 (지난 여행) */
.passport { position: relative; margin: 24px 0 10px; padding: 0 14px 70px; border-radius: 18px; color: var(--paper-ink); overflow: hidden; box-shadow: var(--shadow);
  background-color: var(--paper);
  background-image: repeating-radial-gradient(circle at 15% 25%, rgba(42, 93, 176, .055) 0 1.5px, transparent 1.5px 10px), repeating-radial-gradient(circle at 85% 80%, rgba(255, 107, 74, .045) 0 1.5px, transparent 1.5px 12px); }
.pp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 -14px 4px; padding: 11px 16px; background: var(--paper-head); color: #fff; font-weight: 900; font-size: 15.5px; }
.pp-head b { font: 700 11px var(--mono); letter-spacing: .14em; color: #c9d6ee; }
.pp-year { margin: 14px 2px 8px; font: 700 12px var(--mono); letter-spacing: .22em; color: var(--paper-ink); opacity: .8; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 8px; }
.st { aspect-ratio: 1.1; display: grid; place-items: center; text-align: center; padding: 5px; border: 2.5px solid var(--stamp); border-radius: 50%; color: var(--stamp); font: 700 10px/1.25 var(--mono); letter-spacing: .04em; mix-blend-mode: multiply; }
.st b { display: block; font: 900 18px/1.05 Georgia, "Times New Roman", serif; letter-spacing: .02em; }
.st .stn { display: block; max-width: 76px; margin: 2px auto 1px; font: 700 10.5px/1.25 var(--sans); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st.rect { border-radius: 8px; border-style: double; border-width: 4.5px; }
.st.dash { border-style: dashed; }
.st.add { --stamp: var(--muted); border-style: dashed; border-width: 2px; mix-blend-mode: normal; font: 700 12px/1.3 var(--sans); letter-spacing: 0; }
.st.add b { font: 900 26px/1 var(--sans); }
.add-row { margin-top: 12px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.person { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--sheet); box-shadow: var(--shadow); font-size: 15px; font-weight: 700; }
.person small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.person .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; }
.person.add { padding: 7px 14px; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); background: none; }
.lines li .x small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.lines.bal li { align-items: center; }
.lines.bal li > span:last-child { font-weight: 800; white-space: nowrap; }
.settle { display: grid; grid-template-columns: auto auto auto 1fr; gap: 8px; align-items: center; padding: 6px 0; font-size: 16px; }
.settle span[aria-hidden] { color: var(--coral); font-weight: 900; }
.settle .amt { justify-self: end; font-weight: 900; font-size: 17px; }
.c-pp { --c: var(--brand); }
.wx { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); font-weight: 600; }
.wx b { color: var(--ink); font-weight: 800; }
.wx .wx-i { font-size: 18px; color: #f2a900; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; vertical-align: 0; }
.wx .wx-cloud, .wx .wx-foggy { color: #8a9bb0; } .wx .wx-rainy, .wx .wx-thunderstorm { color: #4f8fe6; } .wx .wx-weather_snowy { color: #7fb3e8; }
.wx .rain { margin-left: 4px; color: var(--accent); }
.wx .rain .ms { font-size: 14px; vertical-align: -.1em; }
.today-strip { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 2px 10px; font-size: 14px; color: var(--muted); }
.today-strip b { color: var(--ink); }
.todo-line { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--warn); }
.todo-line i { font-style: normal; color: var(--muted); }
.todo-line .ms { font-size: 15px; vertical-align: -.15em; }
.stubc b .todo-line { margin-top: 2px; font-weight: 700; }
.nst { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; }
.nst .ms { font-size: 19px; vertical-align: 0; }
.nst.ok { color: var(--mint); } .nst.busy { color: var(--accent); } .nst.bad { color: var(--bad); }
.rec-add { display: inline-flex; align-items: center; gap: 4px; margin: 8px 0 0 22px; padding: 4px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 700; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--line); }
.rec { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; width: calc(100% - 22px); margin: 8px 0 0 22px; padding: 10px 12px; border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); border-left: 4px solid var(--coral); text-align: left; }
.rec .rec-i { color: var(--coral); }
.rec-t { flex: 1 1 60%; font-size: 15px; line-height: 1.4; }
.rec-k { display: inline-flex; gap: 8px; }
.rec-kid { display: inline-flex; align-items: center; gap: 2px; }
.face { display: inline-block; width: 30px; height: 30px; vertical-align: middle; }
.face svg { width: 100%; height: 100%; display: block; }
.kid-dot { display: inline-grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; }
.kst { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--k); color: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
.kst .ms { font-size: 20px; vertical-align: 0; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.kst.none { background: var(--field); color: var(--muted); box-shadow: none; font-weight: 800; }
.kid-h { display: flex !important; align-items: center; gap: 6px; }
.kst-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.kst-grid label { position: relative; }
.kst-grid input { position: absolute; opacity: 0; pointer-events: none; }
.kst-grid .kst { width: 46px; height: 46px; opacity: .5; transform: scale(.9); transition: transform .12s, opacity .12s; }
.kst-grid .kst .ms { font-size: 26px; }
.kst-grid input:checked + .kst { opacity: 1; transform: scale(1.08); box-shadow: 0 0 0 3px var(--sheet), 0 0 0 5px var(--k, var(--muted)); }
.who .face { width: 22px; height: 22px; margin: -3px 4px -3px -4px; }
.pk { flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--k); color: #fff; }
.pk .ms { font-size: 19px; vertical-align: 0; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--field); }
.seg button { flex: 1; padding: 9px 8px; border-radius: 11px; font-size: 15px; font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
.ck-seg { margin: 0 0 12px; }
.ck-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.ck-seg .ms { font-size: 18px; vertical-align: 0; }
.ck-seg .n { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 12px; line-height: 20px; }
.checks .tx small { color: var(--muted); font-size: 12.5px; }
.dh { flex-wrap: wrap; }
.dh-act { margin-left: auto; display: inline-flex; gap: 6px; }
.dh .now + .dh-act { margin-left: 8px; }
.dbtn { display: inline-flex; align-items: center; gap: 3px; padding: 3px 10px; border-radius: 999px; background: var(--sheet); box-shadow: var(--shadow); font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
.dbtn.on { background: var(--brand); color: #fff; }
.dbtn .ms { font-size: 16px; vertical-align: 0; }
.map.day-map { height: 240px; min-height: 0; margin: 0 0 10px; }
.map.day-map.nomap { height: auto; padding: 14px; font-size: 14px; color: var(--muted); text-align: center; }
.find-day { margin: -4px 0 10px; }
.visited-map { height: 62vh; min-height: 320px; margin-top: 8px; }
.pp-map { display: inline-flex; align-items: center; gap: 3px; padding: 3px 11px; border-radius: 999px; background: rgba(255, 255, 255, .18); color: #fff; font-size: 13px; font-weight: 800; }
.pp-map .ms { font-size: 16px; vertical-align: 0; }
.vpin { padding: 2px 8px; border-radius: 999px; border: 2px solid #fff; background: var(--coral); color: #fff; font: 900 12px/1.4 var(--sans); white-space: nowrap; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.people.small { gap: 5px; margin: 0 0 10px; }
.people.small .person { padding: 3px 10px 3px 3px; font-size: 13px; gap: 5px; box-shadow: none; border: 1px solid var(--line); }
.people.small .av { width: 20px; height: 20px; font-size: 11px; }
.people.small .person.add { padding: 3px 10px; font-size: 14px; border: 1px solid var(--line); box-shadow: none; color: var(--muted); }

/* Tage / 날짜별 일정 */

.todo { color: var(--warn); font-weight: 700; }
.c-move { --c: var(--move); --cbg: var(--move-bg); } .c-stay { --c: var(--stay); --cbg: var(--stay-bg); }
.c-food { --c: var(--food); --cbg: var(--food-bg); } .c-see { --c: var(--see); --cbg: var(--see-bg); } .c-cafe { --c: var(--cafe); --cbg: var(--cafe-bg); } .c-etc { --c: var(--etc); --cbg: var(--etc-bg); }

/* Felder und Knöpfe / 입력칸과 버튼 */
.in, .add input { width: 100%; padding: 11px 13px; font-size: 17px; outline: 0; -webkit-appearance: none; appearance: none; background: var(--field); border: 1.5px solid transparent; border-radius: 13px; }

input[type="date"].in { min-height: 46px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; min-height: 46px; border-radius: 13px; background: var(--brand); color: #fff; font-weight: 700; }

.fab { position: fixed; z-index: 5; right: max(18px, calc(50% - 292px)); bottom: calc(22px + env(safe-area-inset-bottom)); height: 58px; padding: 0 22px; border-radius: 20px; background: var(--sun); color: var(--sun-ink); font-weight: 800; font-size: 17px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }

/* Eingabeblatt von unten / 아래에서 올라오는 입력 창 */

  padding: 0 18px calc(20px + env(safe-area-inset-bottom)); background: var(--sheet); border-radius: 24px 24px 0 0; animation: up .2s ease-out; }

.orig { display: block; margin-top: 1px; font-size: 12px; font-weight: 500; color: var(--muted); }
.nobk { margin: 18px 2px 0; }
.nobk summary { cursor: pointer; color: var(--muted); font-weight: 700; font-size: 14px; padding: 6px 0; }
.nobk .items { margin-top: 8px; opacity: .75; }
.items[data-dnd] > .it { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

  padding: 11px 18px; border-radius: 14px; background: #10302f; color: #fff; font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; }

<body>
<div id="app"></div>
<div id="sheet-root" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="maps-config.js"></script>
<script src="../our-family/stickers-shared.js" async onload="window.render && render()"></script>
<script>
'use strict';
// ---------- Speicher / 저장 ----------
// Ohne Anmeldung liegt alles in localStorage. Angemeldet ist das Dokument households/{가족 코드}_travel die Quelle,
// localStorage behält nur eine Kopie für den schnellen Start.
// 로그인 안 하면 이 기기에만 저장. 로그인하면 households/{가족 코드}_travel 문서가 원본이고 기기에는 사본만.
const LS = 'travel-v1';
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + ':' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  put(k, v) { try { localStorage.setItem(LS + ':' + k, JSON.stringify(v)); } catch {} },
};
let trips = store.get('trips', {});
let unsynced = new Set(store.get('unsynced', []));

// ---------- Texte / 문구 ----------

// Notion-Unterseiten als Gruppen / 노션 하위 페이지 = 묶음

const scopeOf = (tr) => { const s = ui.grp != null ? groupSpan(tr, ui.grp) : null; return s ? { ...tr, start: s[0], end: s[1] } : viewOf(tr); };

const needBook = (x) => !!x.booked || !!x.need;
function bookTab(tr) {

  const allStays = all.filter((x) => x.cat === 'stay').sort(byDate);
  const stays = allStays.filter(needBook);
  const moves = all.filter((x) => x.cat === 'move' && needBook(x)).sort(byDate);
  const others = all.filter((x) => x.cat !== 'stay' && x.cat !== 'move' && needBook(x)).sort(byDate);
  const need = [...stays, ...moves, ...others];
  const done = need.filter((x) => x.booked).length;
  let h = '';
  if (need.length) {
    h += `<div class="card"><div class="stat"><span>${esc(t('bookDone'))}</span><b>${esc(t('bookOf', { a: done, b: need.length }))}</b></div>
      <div class="progress"><span style="width:${Math.round((done / need.length) * 100)}%"></span></div></div>`;
  }
  // Nächte ohne Unterkunft / 숙소가 없는 밤
  if (isDate(sc.start) && isDate(sc.end) && sc.end > sc.start) {
    const gaps = [];
    for (let d = sc.start; d < sc.end; d = addDays(d, 1)) {
      if (!allStays.some((s) => isDate(s.date) && s.date <= d && d < (isDate(s.end) ? s.end : addDays(s.date, 1)))) gaps.push(d);
    }
    if (gaps.length) h += `<div class="card"><b>${esc(t('gaps'))}</b><div class="gaps">${gaps.map((d) => `<span>${esc(dayName(d, { month: 'numeric', day: 'numeric', weekday: 'short' }))}</span>`).join('')}</div></div>`;
  }
  if (!stays.length && !moves.length && !others.length) h += `<p class="empty">${esc(t('noBook'))}</p>`;
  const sec = (title, list) => (list.length ? `<h2>${esc(title)}</h2><div class="items">${list.map((x) => `<div class="bk">${itemCard(x, tr)}
    <button class="tick${x.booked ? ' on' : ''}" data-act="toggle-book" data-id="${x.id}" aria-pressed="${!!x.booked}" aria-label="${esc(t('isBooked'))}"><span class="box">${x.booked ? '✓' : ''}</span></button></div>

function settle(bal) {
  const cr = [], db = [];
  for (const [id, b] of Object.entries(bal)) {
    const v = Math.round((b.paid - b.share) * 100) / 100;
    if (v > 0.009) cr.push([id, v]); else if (v < -0.009) db.push([id, -v]);
  }
  cr.sort((a, b) => b[1] - a[1]); db.sort((a, b) => b[1] - a[1]);
  const out = [];
  let i = 0, j = 0;
  while (i < db.length && j < cr.length) {

    out.push([db[i][0], cr[j][0], Math.round(x * 100) / 100]);
    db[i][1] -= x; cr[j][1] -= x;

// ---------- Deutsch: eingegebene Texte automatisch übersetzen / 독일어: 입력한 글 자동 번역 ----------
// Nur in der deutschen Ansicht und nur Text mit Hangul. Übersetzt wird, was gerade auf dem Bildschirm steht (MyMemory, frei,
// wie im 우리가족 app). Ergebnis je Reise in trip.trx[hashId(Text)] – für die ganze Familie gespeichert, nicht in Notion.
// 독일어 화면에서만, 한글이 있는 글만. 지금 화면에 나온 글부터 번역 (우리가족 앱과 같은 무료 MyMemory).
// 결과는 여행마다 trip.trx[hashId(글)]에 저장해서 가족이 같이 씀. 노션에는 안 넣음. 한국어를 고치면 새 글이라 다시 번역.
const HANGUL = /[가-힣]/;
const trQ = new Map(), trFail = new Set();
let trBusy = false, trTimer = 0;
function tx(tr, s) {
  if (!s || ui.lang !== 'de' || !HANGUL.test(s) || !tr || !tr.id) return s;
  if (s.includes('\n')) return s.split('\n').map((l) => tx(tr, l)).join('\n');
  const t0 = s.trim(), d = tr.trx && tr.trx[hashId(t0)];
  if (d) return d;
  trWant(tr.id, t0);
  return s;
}
// Übersetzung mit kleinem Original darunter / 번역 + 원문 작게
const txo = (tr, s) => { const d = tx(tr, s); return d !== s ? `${esc(d)}<small class="orig">${esc(s)}</small>` : esc(s); };
function trWant(tid, s) {
  const k = tid + '|' + hashId(s);
  if (trQ.has(k) || trFail.has(k)) return;
  trQ.set(k, { tid, h: hashId(s), s });
  clearTimeout(trTimer); trTimer = setTimeout(trRun, 400);
}
async function trOne(s) {
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(s.slice(0, 450))}&langpair=ko|de`);
  const d = await r.json().catch(() => null);
  const out = d && d.responseData && d.responseData.translatedText;
  if (r.status === 429 || (d && Number(d.responseStatus) === 429) || /MYMEMORY WARNING|USED ALL AVAILABLE/i.test(out || '')) throw new Error('limit');
  if (!r.ok || !d || Number(d.responseStatus) !== 200 || !out || /QUERY LENGTH LIMIT|INVALID/i.test(out)) throw new Error('translate');
  return out;
}
async function trRun() {
  if (trBusy || !navigator.onLine || Date.now() < store.get('trPause', 0)) return;
  trBusy = true;
  const out = [];
  try {
    // Aktuelle Reise zuerst / 지금 보는 여행 먼저
    const jobs = [...trQ.entries()].sort(([, a], [, b]) => (b.tid === ui.trip) - (a.tid === ui.trip)).slice(0, 25);
    for (const [k, j] of jobs) {
      trQ.delete(k);
      if (!trips[j.tid]) continue;
      try { out.push([['trips', j.tid, 'trx', j.h], await trOne(j.s)]); }
      catch (e) {
        trFail.add(k);
        // Tageskontingent aufgebraucht: 6 Stunden Pause / 하루 무료 한도를 다 쓰면 6시간 쉼
        if (e.message === 'limit') { store.put('trPause', Date.now() + 6 * 3600e3); trQ.clear(); break; }
      }
      if (out.length >= 10) write(out.splice(0), { sync: true });
    }
  } finally {
    if (out.length) write(out, { sync: true });
    trBusy = false;
    if (trQ.size && Date.now() >= store.get('trPause', 0)) trTimer = setTimeout(trRun, 800);
  }
}

// ---------- Wetter und Ortszeit (Open-Meteo, frei, ohne Schlüssel) / 날씨와 현지 시각 ----------
// Vorhersage für 16 Tage am Ort des Tages; die Antwort nennt auch die Zeitzone des Ortes.
// 그 날 장소의 16일 예보. 응답에 그 장소의 시간대도 들어 있어서 현지 시각에 씀.
const WX_ICON = (c) => (c === 0 ? 'sunny' : c <= 2 ? 'partly_cloudy_day' : c === 3 ? 'cloud' : c <= 48 ? 'foggy'
  : c <= 67 || (c >= 80 && c <= 82) ? 'rainy' : c <= 77 || c === 85 || c === 86 ? 'weather_snowy' : 'thunderstorm');
const wxMem = {};
async function weatherAt(lat, lng) {
  const k = `${lat.toFixed(2)},${lng.toFixed(2)}`;
  if (wxMem[k] && wxMem[k].p) return wxMem[k].p;
  const c = wxMem[k] || store.get('wx:' + k, null);
  if (c && c.at && Date.now() - c.at < 3 * 3600e3) return (wxMem[k] = c);
  const p = (async () => {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lng.toFixed(3)}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`);
    if (!r.ok) throw new Error('weather ' + r.status);
    const j = await r.json(), days = {}, D = j.daily || {};
    (D.time || []).forEach((d, i) => { days[d] = [D.weather_code[i], Math.round(D.temperature_2m_max[i]), Math.round(D.temperature_2m_min[i]), D.precipitation_probability_max ? D.precipitation_probability_max[i] : null]; });
    const v = { at: Date.now(), tz: j.timezone, days };
    store.put('wx:' + k, v);
    return v;
  })();
  wxMem[k] = { p };
  try { const v = await p; wxMem[k] = v; return v; } catch (e) { delete wxMem[k]; throw e; }
}
// Ort eines Tages: erster Ort des Tages, sonst Mitte der Reise / 그 날 첫 장소, 없으면 여행 가운데
function dayLoc(tr, d) {
  const s = dayStops(tr, d).find((x) => x.loc && isFinite(x.loc.lat));
  return s ? s.loc : tripPoint(tr);
}
const wxSoon = (d) => d >= today() && diff(today(), d) <= 15;
const wxHtml = (w) => `${ms(WX_ICON(w[0]), 'wx-i wx-' + WX_ICON(w[0]))}<b>${w[1]}°</b><span>/${w[2]}°</span>${w[3] != null && w[3] >= 30 ? `<span class="rain">${ms('umbrella')}${w[3]}%</span>` : ''}`;
const clock = (tz) => new Intl.DateTimeFormat(locale(), { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz }).format(new Date());
// Nach dem Zeichnen füllen (ohne die Seite neu zu zeichnen) / 그린 뒤 채우기 (다시 그리지 않음)
async function fillWeather() {
  const tr = trips[ui.trip];
  if (!tr) return;
  for (const el of document.querySelectorAll('.wx[data-day]')) {
    const d = el.dataset.day, loc = dayLoc(tr, d);
    if (!loc) continue;
    try {
      const v = await weatherAt(loc.lat, loc.lng);
      if (v.days[d] && document.body.contains(el)) { el.innerHTML = wxHtml(v.days[d]); el.hidden = false; }
      const lt = document.querySelector('[data-lt]');
      if (lt && d === today() && v.tz) {
        const here = clock(v.tz), home = clock('Europe/Berlin');
        lt.innerHTML = `${ms('schedule')} ${esc(t('localTime'))} <b>${esc(here)}</b>${here !== home ? ` · ${esc(t('homeTime'))} ${esc(home)}` : ''}`;
        lt.hidden = false;
      }
    } catch (e) { console.warn(e); }
  }
}

// ---------- Was vor der Abreise noch offen ist (Startseite) / 출발 전 남은 일 (홈) ----------
// Startseite: offene Aufgaben (nicht die Packliste) / 홈: 남은 할 일 개수 (짐 체크리스트는 빼고)

// ---------- Packlisten der Kinder (mit Bildern) / 아이별 짐 목록 (그림과 함께) ----------
const PACK_ICON = [[/잠옷|schlafanzug|pyjama/i, 'bedtime'], [/수영|bade/i, 'pool'], [/신발|schuh/i, 'hiking'], [/장난감|인형|spielzeug/i, 'toys'], [/책|buch/i, 'menu_book'],
  [/간식|snack/i, 'cookie'], [/물병|trinkflasche|flasche/i, 'local_drink'], [/헤드폰|kopfhörer/i, 'headphones'], [/모자|mütze|hut/i, 'face'], [/옷|kleidung|anzieh/i, 'checkroom'],
  [/선크림|sonnencreme/i, 'sunny'], [/우산|regen/i, 'umbrella'], [/가방|rucksack/i, 'backpack']];
const packIcon = (text) => (PACK_ICON.find(([re]) => re.test(text)) || [, 'backpack'])[1];
const kidColor = (k) => (KIDS.find((x) => x[0] === k) || [])[3] || 'var(--muted)';

// Zwei Unterthemen: 할 일 (Aufgaben, auch die To-dos aus Notion) und 체크리스트 (Packliste, je Kind filterbar)
// 소주제 두 개: 할 일(노션 할 일 포함)과 체크리스트(짐, 아이별로 볼 수 있음)
const isPack = (x) => x.kind === 'pack' || !!x.who;

  const done = list.filter((x) => x.done).length;

  if (ui.view === 'trip' && ui.tab === 'plan' && document.querySelector('.items[data-dnd] > .it') && !store.get('dragHint', false)) { store.put('dragHint', true); setTimeout(() => toast(t('dragHint')), 600); }
  // Geöffnete Tageskarten zeichnen / 펼친 날짜 지도 그리기
  clearMaps();
  // Unveränderte Karte wiederverwenden (spart Kartenladungen) / 그대로인 지도는 다시 씀 (지도 불러오기 절약)
  const keepMaps = new Map();
  if (ui.view === 'trip' && ui.tab === 'plan') for (const box of document.querySelectorAll('.day-map')) {
    const pts = dayPoints(trips[ui.trip], box.dataset.day);
    // Ohne Orte keine Weltkarte zeigen / 위치가 없으면 엉뚱한 지도 대신 안내
    if (!pts.length) { box.classList.add('nomap'); box.textContent = t('dayNoLoc'); continue; }
    const key = [ui.trip, ui.lang, box.dataset.day, JSON.stringify(pts.map((p) => [p.lat, p.lng, p.label, p.title, p.cls]))].join('|');
    const old = dayMapCache.get(key);
    if (old && !keepMaps.has(key)) { box.replaceWith(old); keepMaps.set(key, old); continue; }
    drawMap(box, pts, { route: true, keep: true });
    keepMaps.set(key, box);
  }
  dayMapCache = keepMaps;
  const conv = $('#conv');
  if (conv) conv.addEventListener('input', () => {
    const tr = trips[ui.trip], v = parseFloat(conv.value.replace(/[^\d.,]/g, '').replace(',', '.'));
    $('#conv-out').textContent = isNaN(v) ? '€' : money(v * tr.rate, 'EUR');
  });
}

// ---------- Navigation ----------
// Der Zustand steht auch in der Adresse (#/t/{id}/{tab}), damit ein Neuladen dieselbe Seite zeigt.
// 주소(#/t/{id}/{탭})에도 남겨서 새로 고쳐도 같은 화면.
function go(hash) {
  try { if (location.hash !== hash) history.pushState(null, '', hash); } catch {}
  route(hash);
}
function route(hash) {
  const m = (typeof hash === 'string' ? hash : location.hash).match(/^#\/t\/([^/]+)(?:\/(\w+))?/);
  if (m && valid(trips[m[1]])) {
    ui.view = 'trip';
    if (ui.trip !== m[1]) { ui.memoEdit = false; ui.grp = undefined; ui.who = ''; ui.ck = ''; ui.dayMaps = new Set(); if (window.notionSync) window.notionSync.opened(m[1]); }
    ui.trip = m[1]; ui.tab = m[2] || (status(trips[m[1]]) === 'now' ? 'today' : 'plan');
  }
  else { ui.view = 'home'; ui.trip = null; ui.scrolled = ''; }
  render(true);
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => route());

// Ganz oben nach unten ziehen schließt das Blatt (wie bei iPhone-Apps) / 맨 위에서 아래로 쓸어내리면 닫힘
function dragToClose(panel) {
  let y0 = null, dy = 0;
  panel.addEventListener('touchstart', (e) => {
    y0 = panel.scrollTop <= 0 && !e.target.closest('input, textarea, select') ? e.touches[0].clientY : null;
    dy = 0;
  }, { passive: true });
  panel.addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || panel.scrollTop > 0) { panel.style.transform = ''; return; }
    e.preventDefault();
    panel.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  panel.addEventListener('touchend', () => {
    if (y0 == null) return;
    y0 = null;
    if (dy > 110) { closeSheet(); return; }
    panel.style.transition = 'transform .15s'; panel.style.transform = '';
    setTimeout(() => { panel.style.transition = ''; }, 160);
  });
}
function closeSheet() { sheetRoot.hidden = true; sheetRoot.innerHTML = ''; document.body.classList.remove('locked'); if (pending) render(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheetRoot.hidden) closeSheet(); });

      p.querySelectorAll('[data-flag]').forEach((x) => x.classList.toggle('on', x === b));

      }
    }));

    f.addEventListener('submit', (e) => {

      if (!title) { toast(t('needTitle')); f.title.focus(); return; }
      const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
      const start = f.start.value, end = f.end.value && f.end.value >= start ? f.end.value : start;
      const fields = {
        title, icon: f.icon.value.trim() || '✈️', start, end: start ? end : '', year: start ? +start.slice(0, 4) : (parseInt(f.year.value, 10) || new Date().getFullYear()),
        cur: f.cur.value, rate: f.cur.value === 'EUR' ? 1 : num(f.rate.value), budget: num(f.budget.value), cover: f.cover.value.trim(), album: /^https?:\/\//.test(f.album.value.trim()) ? f.album.value.trim() : '', apFrom: f.apFrom.value.trim().toUpperCase(), apTo: f.apTo.value.trim().toUpperCase(), mode: f.mode.value || '', mt: Date.now(),
      };
      if (isNew) {
        // Ohne Häkchen "auch in Notion" nur in der App (local) / 노션 체크를 끄면 앱에만 (local)
        const local = f.toNotion ? !f.toNotion.checked : record;
        write([[['trips', tr.id], { id: tr.id, ...fields, items: {}, checks: {}, memo: record && f.memo ? f.memo.value.trim() : '', created: Date.now(), ...(local && { local: true }) }]]);
        closeSheet();
        if (record) toast(t('recorded')); else go(`#/t/${tr.id}/plan`);
      } else {
        write(Object.entries(fields).map(([k, v]) => [['trips', tr.id, k], v]));
        closeSheet();
      }
    });
  });
}

async function fetchRate(cur) {
  try {
    const r = await fetch(`https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(cur)}&symbols=EUR`);
    if (!r.ok) throw 0;
    const j = await r.json();
    return j.rates && j.rates.EUR ? +j.rates.EUR.toPrecision(5) : null;
  } catch { return null; }
}

  const b = e.target.closest('[data-act]');
  if (!b || !ACT[b.dataset.act]) return;
  if (b.tagName === 'BUTTON' && b.type === 'submit' && b.form) return;
  e.preventDefault();
  // Ein Knopf auf einem veralteten Bildschirm (Eintrag inzwischen gelöscht): neu zeichnen statt Fehler / 이미 지워진 항목의 버튼이면 오류 대신 화면 새로
  try { ACT[b.dataset.act](b, e); } catch (err) { console.warn(err); render(true); }
});
document.addEventListener('submit', async (e) => {
  const f = e.target, kind = f.dataset.form;
  if (kind === 'add-check') {
    e.preventDefault();
    const text = f.text.value.trim();
    if (!text) return;
    const id = uid('c');
    write([[['trips', ui.trip, 'checks', id], { id, text, done: false, order: Date.now() / 1000, ...(ui.grp && { grp: ui.grp }), ...(ui.ck === 'pack' && { kind: 'pack' }), ...(ui.ck === 'pack' && KIDS.some(([k]) => k === ui.who) && { who: ui.who }) }], touch(ui.trip)]);
    const input = $('form[data-form=add-check] input'); if (input) input.focus();
  } else if (kind === 'spend') {
    e.preventDefault();
    const amount = parseAmount(f.amount.value);
    if (!amount || isNaN(amount)) { f.amount.focus(); return; }
    ui.spendCur = f.cur.value; ui.spendCat = f.cat.value;
    const id = uid('s');
    const ppl = peopleOf(trips[ui.trip]);
    write([[['trips', ui.trip, 'spend', id], { id, date: today(), amount, cur: f.cur.value, cat: f.cat.value || 'etc', title: f.title.value.trim(), payer: ppl[0].id, split: ppl.map((p) => p.id), t: Date.now() }], touch(ui.trip)]);
  } else if (kind === 'memo') {
    e.preventDefault();
    ui.memoEdit = false;
    write([[['trips', ui.trip, 'memo'], f.memo.value], touch(ui.trip)]);
  } else if (kind === 'join') {
    e.preventDefault();
    const c = window.cloud; c.note = '';
    try { if (!(await c.join(f.code.value))) c.note = t('badCode'); } catch (err) { console.warn(err); c.note = t('joinFail'); }
    window.refreshSettings();
  }
});
// iOS: kein Zoomen mit zwei Fingern / 두 손가락 확대 막기
document.addEventListener('gesturestart', (e) => e.preventDefault());

// ---------- Schnittstelle für die Synchronisierung / 동기화 연결부 ----------
window.travel = {
  trips: () => trips,
  vacSync() { scheduleVac(); },
  setTrips(remote) { trips = remote || {}; persist(); if (ui.view === 'trip' && !valid(trips[ui.trip])) go('#/'); else render(); window.refreshSettings(); },
  unsynced: () => unsynced,
  clearUnsynced() { unsynced = new Set(); store.put('unsynced', []); },
  syncedHouse: () => store.get('house', null),
  setSyncedHouse: (h) => store.put('house', h),
  refresh() { render(); window.refreshSettings(); },
};
route();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
</script>
<script src="notion-sync.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
// ---------- 함께 보기 (Firebase) ----------
// Gleiches Firebase-Projekt und gleicher Familiencode wie 장보기/주간식단. Die Reisen liegen in einem eigenen
// Dokument households/{code}_travel, damit das gemeinsame Haushaltsdokument klein bleibt.
// 장보기·주간식단과 같은 Firebase, 같은 가족 코드. 여행은 따로 households/{코드}_travel 문서에 저장.
const cfg = window.FIREBASE_CONFIG, APP = window.travel;
if (cfg && APP) {
  const cloud = window.cloud = { ready: false, user: null, house: null, live: false, error: '', note: '' };
  let A, F, initializeApp;
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    [{ initializeApp }, A, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  } catch (e) {
    console.warn('firebase', e);
    cloud.ready = true; cloud.unavailable = true; APP.refresh();
  }
  if (A) {
    const fb = initializeApp(cfg), auth = A.getAuth(fb);
    const db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
    const tdoc = () => F.doc(db, 'households', cloud.house + '_travel');
    let unsub = null, retryTimer = 0, retries = 0;
    const msg = () => (document.documentElement.lang === 'de' ? 'Speichern fehlgeschlagen. Bitte Internetverbindung prüfen' : '서버에 저장하지 못했어요. 인터넷 연결을 확인해 주세요');
    const fail = (e) => { console.warn('sync', e); cloud.error = msg(); APP.refresh(); };
    const ok = () => { if (cloud.error) { cloud.error = ''; APP.refresh(); } };
    function stop() { if (unsub) unsub(); unsub = null; cloud.live = false; }

    cloud.write = (entries) => {
      const args = [];
      // JSON hin und zurück: Firestore lehnt "undefined" ab / Firestore는 undefined 값을 거부하므로 정리
      for (const [path, v] of entries) args.push(new F.FieldPath(...path), v == null ? F.deleteField() : JSON.parse(JSON.stringify(v)));
      return F.updateDoc(tdoc(), ...args).then(ok, fail);
    };

    function listen() {
      stop(); clearTimeout(retryTimer);
      let first = true, creating = false;
      unsub = F.onSnapshot(tdoc(), async (snap) => {
        if (!snap.exists()) {
          // Erstes Mal für diese Familie: Dokument anlegen / 이 가족의 첫 여행 문서 만들기
          if (!creating) { creating = true; try { await F.setDoc(tdoc(), { trips: {}, created: Date.now() }, { merge: true }); } catch (e) { fail(e); } }
          return;
        }
        retries = 0;
        const remote = snap.data().trips || {};
        if (first) {
          first = false;
          // Beim ersten Kontakt: Reisen, die nur hier liegen, mitnehmen; bei einem anderen Familiencode nichts mitnehmen.
          // 처음 연결: 이 기기에만 있는 여행을 올림. 다른 가족 코드로 옮길 때는 올리지 않음.
          const mine = APP.trips(), synced = APP.syncedHouse(), entries = [];
          const firstEver = !synced, same = synced === cloud.house, dirty = APP.unsynced();
          for (const id of Object.keys(mine)) {
            if (!mine[id] || !mine[id].title) continue;
            if ((firstEver && !remote[id]) || (same && dirty.has(id))) { entries.push([['trips', id], mine[id]]); remote[id] = mine[id]; }
          }
          if (same) for (const id of dirty) if (!mine[id] && remote[id]) { entries.push([['trips', id], null]); delete remote[id]; }
          APP.clearUnsynced(); APP.setSyncedHouse(cloud.house);
          if (entries.length) cloud.write(entries);
          cloud.live = true;
          APP.vacSync();
          if (window.notionSync) setTimeout(() => window.notionSync.start(), 500);
        }
        APP.setTrips(remote);
      }, (e) => {
        stop(); fail(e);
        retryTimer = setTimeout(() => { if (cloud.user && cloud.house) listen(); }, Math.min(120, 10 * ++retries) * 1000);
      });
    }
    async function link(code) {
      cloud.house = code;
      try { localStorage.setItem('travel-v1:lastHouse', JSON.stringify(code)); } catch {}
      await F.setDoc(F.doc(db, 'users', auth.currentUser.uid), { house: code }, { merge: true });
      listen(); APP.refresh();
    }
    cloud.idToken = () => auth.currentUser.getIdToken();
    cloud.syncVacations = async (want) => {
      const ref = F.doc(db, 'households', cloud.house), snap = await F.getDoc(ref);
      const cur = (snap.exists() && snap.data().vacations) || {}, args = [];
      const same = (a, b) => a && Object.keys(b).every((k) => a[k] === b[k]) && Object.keys(a).every((k) => k in b);
      for (const [id, v] of Object.entries(want)) if (!same(cur[id], v)) args.push(new F.FieldPath('vacations', id), v);
      for (const id of Object.keys(cur)) if (id.startsWith('trip-') && !want[id]) args.push(new F.FieldPath('vacations', id), F.deleteField());
      if (args.length) await F.updateDoc(ref, ...args);
    };
    cloud.signIn = () => A.signInWithPopup(auth, new A.GoogleAuthProvider());
    cloud.signOut = async () => { clearTimeout(retryTimer); stop(); cloud.house = null; await A.signOut(auth); APP.refresh(); };
    cloud.create = async () => {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map((n) => abc[n % abc.length]).join('');
      await F.setDoc(F.doc(db, 'households', code), { stores: {}, items: {}, stock: {}, meals: {}, created: Date.now() });
      await link(code);
    };
    cloud.join = async (raw) => {
      const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code || !(await F.getDoc(F.doc(db, 'households', code))).exists()) return false;
      await link(code);
      return true;
    };
    A.onAuthStateChanged(auth, async (user) => {
      cloud.user = user;
      if (!user) { stop(); cloud.house = null; }
      else if (!cloud.house) {
        try {
          const u = await F.getDoc(F.doc(db, 'users', user.uid));
          if (u.exists() && u.data().house) cloud.house = u.data().house;
        } catch (e) { console.warn('sync', e); }
        if (cloud.house) listen();
      }
      cloud.ready = true;
      APP.refresh();
    });
  }
}
</script>
