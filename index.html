<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe6ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#102449" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>여행</title>
<style>
/* Aussehen „Bordkarte“: hellblauer Himmel, weiße Tickets mit Abrisskante und Strichcode, Navy-Schrift, Koralle als Akzent.
   Vergangene Reisen stehen als Einreisestempel auf einer Passseite. Farben je Art: Fahrt lila, Unterkunft blau, Essen orange, Ausflug grün.
   모양 '탑승권': 하늘색 바탕, 절취선·바코드가 있는 흰 탑승권, 남색 글씨, 산호색 포인트. 지난 여행은 여권 페이지의 입국 도장.
   종류별 색: 이동 보라, 숙소 파랑, 맛집 주황, 관광 초록. */
:root {
  --bg: #e7f2ff; --bg-top: #cfe6ff; --brand: #13294b; --brand-2: #0c1c36; --on-brand: #fff; --sheet: #fff; --ink: #13294b; --muted: #687a94; --line: #dbe5f2;
  --field: #f0f5fb; --soft: #e4eefb; --accent: #2a5db0; --sun: #ff6b4a; --sun-ink: #fff; --coral: #ff6b4a; --mint: #13946f; --rail: #b8cbe6;
  --ok: #138a63; --ok-bg: #e0f5ec; --warn: #c2541a; --warn-bg: #fff0e6; --bad: #d23a2c;
  --move: #7a5cd3; --stay: #2f72d6; --food: #e3702f; --see: #1d9a64; --etc: #7b8aa0;
  --move-bg: #efeafc; --stay-bg: #e7f0fd; --food-bg: #fdeee4; --see-bg: #e2f5ec; --etc-bg: #eef2f7;
  --shadow: 0 1px 2px rgba(19, 41, 75, .05), 0 6px 18px rgba(19, 41, 75, .08);
  --paper: #fbfdff; --paper-line: #dbe5f2; --paper-ink: #687a94; --paper-head: #13294b;
  --sans: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1730; --bg-top: #102449; --brand: #3d6fd6; --brand-2: #2a56b3; --sheet: #14264a; --ink: #e8eefb; --muted: #9fb0cc; --line: #26395f;
    --field: #1b2f58; --soft: #1a3160; --accent: #93b6ff; --sun: #ff7a5c; --coral: #ff7a5c; --mint: #4fd1a5; --rail: #34507f;
    --ok: #6fdca4; --ok-bg: #173526; --warn: #ffb070; --warn-bg: #3a2818; --bad: #ff7a6b;
    --move: #a68cf0; --stay: #6ea4f5; --food: #f59a5e; --see: #4fcf94; --etc: #a2b0c4;
    --move-bg: #262040; --stay-bg: #182a44; --food-bg: #3a2416; --see-bg: #14322a; --etc-bg: #1f2a3d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --paper: #14264a; --paper-line: #26395f; --paper-ink: #9fb0cc; --paper-head: #1d3a73;
  }
}
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; }
#app { max-width: 620px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--bg-top), var(--bg) 340px); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Kopf / 머리 */
.top { position: relative; padding: calc(12px + env(safe-area-inset-top)) 16px 4px; color: var(--ink); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 40px; border-radius: 50%; font-size: 18px; color: var(--ink); text-decoration: none; }
.top .icon-btn { background: var(--sheet); box-shadow: var(--shadow); }
.back { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--sheet); box-shadow: var(--shadow); font-weight: 700; font-size: 15px; }
.lang { display: flex; gap: 12px; }
.lang button { font-size: 14px; color: var(--muted); padding: 4px 0; border-bottom: 2px solid transparent; }
.lang button.on { color: var(--ink); font-weight: 800; border-bottom-color: var(--coral); }
h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.15; letter-spacing: -.035em; }
.chip-d { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--coral); color: #fff; font-weight: 800; font-size: 14px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 6px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 7px 14px; white-space: nowrap; font-size: 15px; font-weight: 700; border-radius: 999px; background: var(--sheet); color: var(--muted); box-shadow: var(--shadow); }
.tab.on { background: var(--brand); color: #fff; }

/* Inhalt / 내용 */
.sheet { flex: 1; padding: 10px 16px calc(110px + env(safe-area-inset-bottom)); position: relative; }
h2 { margin: 22px 2px 10px; font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .01em; }
h2:first-child { margin-top: 2px; }
.empty { margin: 30px 0; text-align: center; color: var(--muted); }
.banner { margin: 0 0 14px; padding: 11px 14px; border-radius: 14px; background: var(--warn-bg); color: var(--warn); font-size: 15px; font-weight: 600; }

/* Bordkarte / 탑승권 */
.tk { display: block; width: 100%; position: relative; margin: 12px 0 16px; background: var(--sheet); border-radius: 18px; box-shadow: var(--shadow); color: var(--ink); text-align: left; }
.tk-img { display: block; height: 84px; border-radius: 18px 18px 0 0; background: var(--soft) center/cover no-repeat; }
.tk-main { display: block; padding: 14px 16px 10px; }
.air { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 800; color: var(--muted); }
.air span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.air b { flex: none; color: var(--coral); }
.route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; margin: 8px 0 2px; }
.apc { display: block; min-width: 0; font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -.02em; }
.apc small { display: block; margin-top: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: 0; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route .r { text-align: right; }
.plane { color: var(--coral); font-size: 20px; padding: 0 8px 20px; }
.stub { display: block; position: relative; padding: 12px 16px 14px; border-top: 2px dashed var(--line); }
.stub::before, .stub::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg-top); }
.stub::before { left: -10px; } .stub::after { right: -10px; }
.stub .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 16px; font-weight: 800; }
.stub small { display: block; font: 600 10px var(--mono); letter-spacing: .12em; color: var(--muted); }
.stub .bar { display: block; height: 30px; margin-top: 10px; opacity: .85; border-radius: 2px;
  background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px, var(--ink) 12px 13px, transparent 13px 17px); }
.tk:has(.dday) .air { padding-right: 86px; }
.dday { position: absolute; right: 14px; top: -11px; z-index: 1; padding: 4px 11px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 14px; font-weight: 900; box-shadow: 0 3px 10px rgba(255, 107, 74, .35); }
.tk-head { margin: 14px 0 0; }
.tk-head .apc { font-size: 34px; }
.tk-head .tk-img { height: 64px; }
.trips { display: grid; gap: 8px; }
.stubc { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; background: var(--sheet); border-radius: 14px; border-left: 4px dashed var(--line); box-shadow: var(--shadow); text-align: left; }
.stubc .c { font-size: 19px; font-weight: 900; line-height: 1.1; }
.stubc .c small { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.stubc b { min-width: 0; font-size: 15.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stubc b small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.stubc .d { font-size: 14px; font-weight: 900; color: var(--coral); white-space: nowrap; }

/* Pass mit Stempeln (vergangene Reisen) / 여권 도장 (지난 여행) */
.passport { position: relative; margin: 24px 0 10px; padding: 0 14px 70px; border-radius: 18px; color: var(--paper-ink); overflow: hidden; box-shadow: var(--shadow);
  background-color: var(--paper);
  background-image: repeating-radial-gradient(circle at 15% 25%, rgba(42, 93, 176, .055) 0 1.5px, transparent 1.5px 10px), repeating-radial-gradient(circle at 85% 80%, rgba(255, 107, 74, .045) 0 1.5px, transparent 1.5px 12px); }
.pp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 -14px 4px; padding: 11px 16px; background: var(--paper-head); color: #fff; font-weight: 900; font-size: 15.5px; }
.pp-head b { font: 700 11px var(--mono); letter-spacing: .14em; color: #c9d6ee; }
.pp-year { margin: 14px 2px 8px; font: 700 12px var(--mono); letter-spacing: .22em; color: var(--paper-ink); opacity: .8; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 8px; }
.st { aspect-ratio: 1.1; display: grid; place-items: center; text-align: center; padding: 5px; border: 2.5px solid var(--stamp); border-radius: 50%; color: var(--stamp); font: 700 10px/1.25 var(--mono); letter-spacing: .04em; mix-blend-mode: multiply; }
.st b { display: block; font: 900 18px/1.05 Georgia, "Times New Roman", serif; letter-spacing: .02em; }
.st .stn { display: block; max-width: 76px; margin: 2px auto 1px; font: 700 10.5px/1.25 var(--sans); letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st.rect { border-radius: 8px; border-style: double; border-width: 4.5px; }
.st.dash { border-style: dashed; }
.mrz::before, .mrz::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
.mrz::before { left: -10px; } .mrz::after { right: -10px; }
.mrz { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 12px; border-top: 2px dashed var(--line); font: 600 11px/1.45 var(--mono); letter-spacing: .1em; color: var(--paper-ink); opacity: .75; white-space: nowrap; overflow: hidden; }
@media (prefers-color-scheme: dark) { .passport .st { mix-blend-mode: normal; filter: brightness(1.45); } }

/* Tage / 날짜별 일정 */
.days { display: flex; gap: 6px; overflow-x: auto; margin: -2px -16px 14px; padding: 4px 16px 6px; scrollbar-width: none; position: sticky; top: 0; z-index: 3; background: var(--bg); }
.days::-webkit-scrollbar { display: none; }
.days button { flex: none; display: flex; flex-direction: column; align-items: center; min-width: 54px; padding: 6px 8px; border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 600; color: var(--muted); }
.days button b { font-size: 17px; color: var(--ink); }
.days button.today { background: var(--coral); color: #fff; }
.days button.today b { color: #fff; }
.day { scroll-margin-top: 80px; margin-bottom: 18px; }
.dh { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
.dh .n { font-weight: 900; font-size: 18px; letter-spacing: -.02em; }
.dh .d { color: var(--muted); font-size: 15px; font-weight: 600; }
.dh .now { margin-left: auto; padding: 1px 9px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 13px; font-weight: 800; }
.night { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; padding: 8px 12px; border-radius: 12px; background: var(--stay-bg); color: var(--stay); font-size: 14px; font-weight: 600; }
.night span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.items { display: grid; gap: 8px; }
.it { display: flex; gap: 12px; width: 100%; padding: 12px 14px 12px 12px; border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); position: relative; }
.it::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
/* Tagesplan wie ein Flugplan: gestrichelte Linie mit farbigen Punkten / 하루 일정은 점선 위의 비행 일정표 */
.day .items { position: relative; padding-left: 22px; }
.day .items::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 8px; border-left: 2px dashed var(--rail); }
.day .it::before { left: -20px; top: 17px; bottom: auto; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 3px var(--bg); }
.cf { position: absolute; right: 10px; top: 8px; padding: 0 4px; border: 1.5px solid var(--mint); border-radius: 4px; color: var(--mint); font: 900 10px/1.6 var(--mono); letter-spacing: .04em; transform: rotate(4deg); opacity: .9; }
.it:has(.cf) .t { padding-right: 82px; }
.it .ic { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; background: var(--cbg); }
.it .ib { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.it .t { font-weight: 700; font-size: 16.5px; line-height: 1.35; overflow-wrap: anywhere; }
.it .m { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 14px; color: var(--muted); align-items: center; }
.it .m .tm { color: var(--c); font-weight: 700; }
.it .nt { font-size: 14px; color: var(--muted); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ok { color: var(--ok); font-weight: 700; }
.todo { color: var(--warn); font-weight: 700; }
.c-move { --c: var(--move); --cbg: var(--move-bg); } .c-stay { --c: var(--stay); --cbg: var(--stay-bg); }
.c-food { --c: var(--food); --cbg: var(--food-bg); } .c-see { --c: var(--see); --cbg: var(--see-bg); } .c-etc { --c: var(--etc); --cbg: var(--etc-bg); }
.add-day { width: 100%; margin-top: 8px; padding: 9px; border-radius: 12px; border: 1.5px dashed var(--line); color: var(--muted); font-size: 15px; font-weight: 600; text-align: center; }

/* Buchungen / 예약 */
.progress { height: 10px; border-radius: 99px; background: var(--field); overflow: hidden; margin: 8px 0 4px; }
.progress span { display: block; height: 100%; border-radius: 99px; background: var(--brand); }
.progress.over span { background: var(--bad); }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stat b { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.stat span { color: var(--muted); font-size: 15px; }
.bk { display: flex; gap: 12px; align-items: flex-start; }
.bk .it { flex: 1; }
.tick { flex: none; width: 52px; align-self: stretch; border-radius: 16px; border: 1.5px solid var(--line); display: grid; place-items: center; }
.tick .box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center; color: #fff; font-size: 17px; font-weight: 800; }
.tick.on { background: var(--ok-bg); border-color: transparent; }
.tick.on .box { background: var(--ok); border-color: var(--ok); }
.code { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 8px; background: var(--field); font: 600 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
.gaps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.gaps span { padding: 3px 10px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 14px; font-weight: 700; }

/* Geld / 돈 */
.card { padding: 16px; border-radius: 18px; background: var(--field); }
.card + .card { margin-top: 10px; }
.bars { display: grid; gap: 10px; margin-top: 4px; }
.bars .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.bars .row i { display: block; height: 12px; border-radius: 99px; background: var(--c); min-width: 4px; }
.bars .row b { font-weight: 700; font-variant-numeric: tabular-nums; }
.rate { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 15px; }
.conv { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.conv input { flex: 1; min-width: 0; }
.conv output { font-weight: 800; font-size: 20px; min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: flex; gap: 10px; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.lines li .x { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines li .dt { color: var(--muted); font-size: 13px; width: 44px; flex: none; }
.lines li .am { text-align: right; font-variant-numeric: tabular-nums; }
.lines li .am small { display: block; color: var(--muted); font-size: 12px; }

/* Checkliste / 체크리스트 */
.add { display: flex; gap: 8px; margin-bottom: 12px; }
.add input { flex: 1; min-width: 0; }
.tpl { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.pill { padding: 6px 12px; border-radius: 999px; background: var(--field); font-size: 14px; font-weight: 600; }
.pill.on { background: var(--brand); color: #fff; }
.grps .pill { text-align: center; line-height: 1.25; }
.grps .pill small { display: block; font-size: 11.5px; font-weight: 600; opacity: .75; }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.checks .cb { flex: 1; display: flex; align-items: center; gap: 12px; padding: 12px 2px; min-width: 0; }
.checks .box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); display: grid; place-items: center; color: #fff; font-size: 16px; font-weight: 800; }
.checks li.done .box { background: var(--brand); border-color: var(--brand); }
.checks li.done .tx { color: var(--muted); text-decoration: line-through; }
.checks .tx { overflow-wrap: anywhere; }
.checks .rm { flex: none; width: 36px; height: 36px; color: var(--muted); font-size: 20px; border-radius: 10px; }

/* Notiz / 메모 */
.memo { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.6; }

/* Felder und Knöpfe / 입력칸과 버튼 */
.in, .add input { width: 100%; padding: 11px 13px; font-size: 17px; outline: 0; -webkit-appearance: none; appearance: none; background: var(--field); border: 1.5px solid transparent; border-radius: 13px; }
.in:focus, .add input:focus { border-color: var(--brand); }
textarea.in { resize: vertical; min-height: 84px; line-height: 1.5; }
select.in { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type="date"].in { min-height: 46px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; min-height: 46px; border-radius: 13px; background: var(--brand); color: #fff; font-weight: 700; }
.btn.sun { background: var(--sun); color: var(--sun-ink); }
.btn.ghost { background: none; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.btn.danger { background: none; color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }

// Großer Bordkarte für die nächste Reise / 다음 여행은 큰 탑승권

// Vergangene Reisen als Einreisestempel im Pass / 지난 여행은 여권 입국 도장
const STAMP_INK = ['#e8553a', '#2a5db0', '#13946f', '#7a5cd3', '#c27a12'];
function passport(past) {
  let h = `<section class="passport"><div class="pp-head"><span>${esc(t('pastPass'))}</span><b>ENTRIES · ${past.length}</b></div>`;
  let y = null, i = 0;

    const seed = parseInt(hashId(x.id), 36);

}
const hashId = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h.toString(36); };

// "오늘" gibt es nur während der Reise / '오늘' 탭은 여행 중에만
const tabsOf = (tr) => [...(status(tr) === 'now' ? ['today'] : []), 'plan', 'book', 'cmp', 'map', 'money', 'check', 'memo'];

function itemCard(it, tr, day) {
  const meta = [];
  const isOut = it.cat === 'stay' && day && day === it.end;
  const tm = isOut ? (it.time || '').split(/\n|\//).find((s) => /아웃|out/i.test(s)) || '' : (it.time || '').split('\n')[0];
  if (tm) meta.push(`<span class="tm">${esc(tm.trim())}</span>`);
  if (it.cat === 'stay' && isDate(it.date) && isDate(it.end) && !day) meta.push(esc(`${md(it.date)} – ${md(it.end)} · ${nightsText(diff(it.date, it.end))}`));
  if (it.cat === 'move' && isDate(it.end) && !day) meta.push(esc(`${md(it.date)} · ${md(it.end)}`));
  if (!isOut) {
    if (it.booked) meta.push(`<span class="ok sr">✓ ${esc(t('booked'))}</span>`);
    else if (it.cat === 'stay' || it.cat === 'move') meta.push(`<span class="todo">${esc(t('notBooked'))}</span>`);
    if (it.cost && it.cost.amount) meta.push(esc(money(it.cost.amount, it.cost.cur)));
  }
  if ((it.links && it.links.length) || URL_RE.test(it.notes || '')) meta.push('🔗');
  URL_RE.lastIndex = 0;
  // Unterseite in Notion (서울여행, 가르다호 …), wenn nicht schon danach gefiltert / 노션 하위 페이지 이름
  if (it.grp && !ui.grp) meta.push(`<span class="grp">${esc(it.grp)}</span>`);
  const notes = (it.notes || '').replace(URL_RE, '').trim();
  return `<button class="it c-${it.cat || 'etc'}${it.done && !isOut ? ' done' : ''}" data-act="edit-item" data-id="${it.id}">${it.booked && !isOut ? `<span class="cf" aria-hidden="true">CONFIRMED</span>` : ''}
    <span class="ic" aria-hidden="true">${isOut ? '🧳' : icon(it)}</span>
    <span class="ib"><span class="t">${isOut ? esc(t('checkout')) + ' · ' : ''}${esc(it.title || '—')}</span>
    ${meta.length ? `<span class="m">${meta.join('')}</span>` : ''}
    ${notes && !isOut ? `<span class="nt">${esc(notes)}</span>` : ''}</span></button>`;
}

// Notion-Unterseiten als Gruppen / 노션 하위 페이지 = 묶음
const groupsOf = (tr) => [...new Set(items(tr).map((x) => x.grp || ''))];
const inGrp = (x) => ui.grp == null || ui.grp === '*' || (x.grp || '') === ui.grp;
// Zeitraum einer Gruppe aus ihren Einträgen (zwei Skireisen in einer Notion-Seite = zwei Gruppen mit eigenen Tagen)
// 묶음의 기간은 그 묶음 일정들의 날짜로 (노션 한 페이지에 스키 여행 두 번 = 묶음 두 개, 날짜·일차도 따로)
function groupSpan(tr, g) {
  const ds = items(tr).filter((x) => (x.grp || '') === g).flatMap((x) => [x.date, x.end]).filter(isDate).sort();
  return ds.length ? [ds[0], ds[ds.length - 1]] : null;
}
const spanDays = (s, e) => { const out = []; for (let d = s; d <= e && out.length < 60; d = addDays(d, 1)) out.push(d); return out; };
// Beim Öffnen: die Gruppe, die gerade läuft oder als nächste kommt; sonst alle / 처음 열 때: 진행 중이거나 다음 묶음, 없으면 전체
function autoGroup(tr, groups) {
  const now = today(), spans = groups.map((g) => [g, groupSpan(tr, g)]).filter(([, s]) => s);
  if (spans.length < 2) return null;
  const cur = spans.find(([, [s, e]]) => s <= now && now <= e);
  if (cur) return cur[0];
  const next = spans.filter(([, [s]]) => s > now).sort((a, b) => a[1][0].localeCompare(b[1][0]))[0];
  return next ? next[0] : null;
}
function planTab(tr) {
  const now = today(), groups = groupsOf(tr);
  if (groups.length < 2) ui.grp = null;
  else if (ui.grp === undefined) ui.grp = autoGroup(tr, groups);
  const span = ui.grp != null ? groupSpan(tr, ui.grp) : null;
  const days = span ? spanDays(span[0], span[1]) : ui.grp != null ? [] : tripDays(tr);
  const all = items(tr).filter(inGrp);
  let h = '';
  if (groups.length > 1) {
    const label = (g) => { const s = groupSpan(tr, g); return esc(g || t('grpMain')) + (s ? `<small>${esc(md(s[0]))}${s[1] !== s[0] ? '–' + esc(md(s[1])) : ''}</small>` : ''); };
    h += `<div class="tpl grps">${[null, ...groups].map((g) => `<button class="pill${(ui.grp ?? null) === g ? ' on' : ''}" data-act="grp" data-g="${g == null ? '*' : esc(g)}">${g == null ? esc(t('mapAll')) : label(g)}</button>`).join('')}</div>`;
  }
  if (days.length > 1) {
    h += `<nav class="days">${days.map((d, i) => `<button data-act="jump" data-day="${d}" class="${d === now ? 'today' : ''}">
      <span>${esc(t('dayNo', { n: i + 1 }))}</span><b>${esc(md(d))}</b></button>`).join('')}</nav>`;
  }
  if (!all.length) h += `<p class="empty">${esc(t('noItems'))}</p>`;
  const stays = all.filter((x) => x.cat === 'stay' && isDate(x.date) && isDate(x.end));
  days.forEach((d, i) => {
    const list = dayItems(tr, d).filter(inGrp);
    // Nächte mitten im Aufenthalt und der Abreisetag / 숙박 중간 밤과 체크아웃 날
    const mid = stays.filter((s) => s.date < d && d < s.end);
    const outs = stays.filter((s) => s.end === d);
    h += `<div class="day" id="d-${d}"><div class="dh"><span class="n">${esc(t('dayNo', { n: i + 1 }))}</span>
      <span class="d">${esc(dayName(d, { month: 'long', day: 'numeric', weekday: 'short' }))}</span>${d === now ? `<span class="now">${esc(t('today'))}</span>` : ''}</div>`;
    for (const s of mid) h += `<div class="night"><span>🛏️</span><span>${esc(t('night', { a: diff(s.date, d) + 1, b: diff(s.date, s.end) }))} · ${esc(s.title)}</span></div>`;
    h += `<div class="items">${outs.map((s) => itemCard(s, tr, d)).join('')}${list.map((x) => itemCard(x, tr, d)).join('')}</div>
      <button class="add-day" data-act="new-item" data-day="${d}">${esc(t('addHere'))}</button></div>`;
  });
  const set = new Set(days);
  const cand = all.filter((x) => !set.has(x.date) && !(x.cat === 'move' && set.has(x.end))).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  if (cand.length) h += `<h2>${esc(t('cand'))}</h2><div class="items">${cand.map((x) => itemCard(x, tr)).join('')}</div>`;
  return h;
}

function bookTab(tr) {
  const all = items(tr);
  const byDate = (a, b) => (a.date || '9').localeCompare(b.date || '9') || (a.order ?? 0) - (b.order ?? 0);
  const stays = all.filter((x) => x.cat === 'stay').sort(byDate);
  const moves = all.filter((x) => x.cat === 'move').sort(byDate);
  const others = all.filter((x) => x.booked && x.cat !== 'stay' && x.cat !== 'move').sort(byDate);
  const need = [...stays, ...moves, ...others];
  const done = need.filter((x) => x.booked).length;
  let h = '';
  if (need.length) {
    h += `<div class="card"><div class="stat"><span>${esc(t('bookDone'))}</span><b>${esc(t('bookOf', { a: done, b: need.length }))}</b></div>
      <div class="progress"><span style="width:${Math.round((done / need.length) * 100)}%"></span></div></div>`;
  }
  // Nächte ohne Unterkunft / 숙소가 없는 밤
  if (isDate(tr.start) && isDate(tr.end) && tr.end > tr.start) {
    const gaps = [];
    for (let d = tr.start; d < tr.end; d = addDays(d, 1)) {
      if (!stays.some((s) => isDate(s.date) && s.date <= d && d < (isDate(s.end) ? s.end : addDays(s.date, 1)))) gaps.push(d);
    }
    h += `<div class="card">${gaps.length ? `<b>${esc(t('gaps'))}</b><div class="gaps">${gaps.map((d) => `<span>${esc(dayName(d, { month: 'numeric', day: 'numeric', weekday: 'short' }))}</span>`).join('')}</div>` : esc(t('allNights'))}</div>`;
  }

  const sec = (title, list) => (list.length ? `<h2>${esc(title)}</h2><div class="items">${list.map((x) => `<div class="bk">${itemCard(x, tr)}
    <button class="tick${x.booked ? ' on' : ''}" data-act="toggle-book" data-id="${x.id}" aria-pressed="${!!x.booked}" aria-label="${esc(t('isBooked'))}"><span class="box">${x.booked ? '✓' : ''}</span></button></div>
    ${x.code ? `<div style="margin:-2px 0 4px 6px"><button class="code" data-act="copy" data-v="${esc(x.code)}">${esc(x.code)} ⧉</button></div>` : ''}`).join('')}</div>` : '');
  h += sec(t('stays'), stays) + sec(t('moves'), moves) + sec(t('others'), others);
  return h;
}

function moneyTab(tr) {
  const all = items(tr).filter((x) => x.cost && x.cost.amount);
  let total = 0, local = 0, missing = 0;
  const by = {};
  for (const x of all) {
    const e = eurOf(x.cost, tr);
    if (e == null) missing++; else { total += e; by[x.cat] = (by[x.cat] || 0) + e; }
    if (x.cost.cur === tr.cur) local += x.cost.amount;
  }
  // Ausgaben unterwegs (Heute-Seite) / 여행 중 지출 ('오늘' 화면에서 기록)
  const spends = spendsOf(tr);
  const plannedTotal = total;
  let spentTotal = 0;
  for (const s of spends) {
    const e = eurOf(s, tr);
    if (e == null) missing++; else { spentTotal += e; by[s.cat] = (by[s.cat] || 0) + e; }
    if (s.cur === tr.cur) local += s.amount;
  }
  total += spentTotal;
  let h = `<div class="card"><div class="stat"><span>${esc(t('total'))}</span><b>${esc(money(total, 'EUR'))}</b></div>`;
  if (spends.length) h += `<div class="note" style="margin:2px 0 0">${esc(t('planned'))} ${esc(money(plannedTotal, 'EUR'))} · ${esc(t('spent'))} ${esc(money(spentTotal, 'EUR'))}</div>`;
  if (tr.cur && tr.cur !== 'EUR' && local) h += `<div class="note" style="margin:2px 0 0">${esc(t('inLocal', { x: money(local, tr.cur) }))}</div>`;
  if (tr.budget) {
    const pct = Math.min(100, Math.round((total / tr.budget) * 100)), over = total > tr.budget;
    h += `<div class="progress${over ? ' over' : ''}"><span style="width:${pct}%"></span></div>
      <div class="stat"><span>${esc(t('budgetOf', { b: money(tr.budget, 'EUR') }))}</span><span class="${over ? 'todo' : 'ok'}">${esc(t(over ? 'over' : 'left', { x: money(Math.abs(tr.budget - total), 'EUR') }))}</span></div>`;
  }
  if (missing) h += `<p class="note">${esc(t('noRate'))}</p>`;
  h += '</div>';
  const max = Math.max(1, ...Object.values(by));
  if (Object.keys(by).length) {
    h += `<div class="card"><b>${esc(t('byCat'))}</b><div class="bars">${[...CAT_ORDER, 'shop'].filter((c) => by[c]).map((c) => `<div class="row c-${c}">
      <span>${esc(t('cats.' + c))}</span><i style="width:${Math.round((by[c] / max) * 100)}%"></i><b>${esc(money(by[c], 'EUR'))}</b></div>`).join('')}</div></div>`;
  }
  if (tr.cur && tr.cur !== 'EUR') {
    h += `<div class="card"><div class="rate"><span>${esc(t('rate'))}: ${tr.rate ? `1 ${esc(tr.cur)} = ${esc(String(+tr.rate.toPrecision(4)))} €` : '—'}</span>
      <button class="btn small ghost" data-act="fetch-rate">${esc(t('fetchRate'))}</button></div>
      ${tr.rate ? `<div class="conv"><input class="in" id="conv" inputmode="decimal" placeholder="${esc(money(1000, tr.cur))}" aria-label="${esc(t('conv'))}"><output id="conv-out">€</output></div>` : ''}</div>`;
  }
  h += `<h2>${esc(t('costList'))}</h2>`;
  if (!all.length && !spends.length) h += `<p class="empty">${esc(t('noCosts'))}</p>`;
  else {
    const rows = [...all.map((x) => ({ d: x.date, x })), ...spends.map((s) => ({ d: s.date, s }))]
      .sort((a, b) => (a.d || '9').localeCompare(b.d || '9') || (a.s ? 1 : 0) - (b.s ? 1 : 0));
    h += `<ul class="lines">${rows.map(({ x, s }) => {
      if (s) return spendLine(s, tr, true);
      const e = eurOf(x.cost, tr);
      return `<li><span class="dt">${x.date ? esc(md(x.date)) : '–'}</span><button class="x" data-act="edit-item" data-id="${x.id}">${icon(x)} ${esc(x.title)}</button>
        <span class="am">${esc(money(x.cost.amount, x.cost.cur))}${x.cost.cur !== 'EUR' && e != null ? `<small>${esc(money(e, 'EUR'))}</small>` : ''}</span></li>`;
    }).join('')}</ul>`;
  }
  return h;
}

  if (window.L) return Promise.resolve(window.L);
  if (!leafletP) leafletP = new Promise((ok, no) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.append(css);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = () => ok(window.L); s.onerror = () => { leafletP = null; no(new Error('leaflet')); };

}

async function initGoogleMap(tr, box, list, day, days) {
  const gm = await loadGoogle();
  const [{ Map, InfoWindow, Polyline }, { AdvancedMarkerElement }] = await Promise.all([gm.importLibrary('maps'), gm.importLibrary('marker')]);
  if (!document.body.contains(box)) return;
  const map = new Map(box, { mapId: GM().mapId || 'DEMO_MAP_ID', gestureHandling: 'greedy', mapTypeControl: false, streetViewControl: false, fullscreenControl: false });
  const holder = { remove() { box.innerHTML = ''; } };
  mapObj = holder;
  const info = new InfoWindow();
  const path = [];
  list.forEach((x, i) => {
    const el = document.createElement('div');
    el.className = `pin c-${x.cat || 'etc'}`;
    el.innerHTML = `<span>${day ? i + 1 : (days.indexOf(x.date) + 1 || '·')}</span>`;
    const pos = { lat: x.loc.lat, lng: x.loc.lng };
    const m = new AdvancedMarkerElement({ map, position: pos, content: el, title: x.title, gmpClickable: true });
    m.addEventListener('gmp-click', () => { info.setContent(popupHtml(x)); info.open({ map, anchor: m }); });
    path.push(pos);
  });
  if (day && path.length > 1) new Polyline({ map, path, strokeColor: '#11777c', strokeOpacity: 0.7, strokeWeight: 3 });
  const key = tr.id + '|' + day + '|' + list.length; // neue Pins → neu einpassen / 핀이 늘면 다시 맞춤
  if (ui.mapView && ui.mapView.key === key) { map.setCenter(ui.mapView.c); map.setZoom(ui.mapView.z); }
  else if (path.length > 1) { const b = new gm.LatLngBounds(); path.forEach((p) => b.extend(p)); map.fitBounds(b, 40); }
  else if (path.length) { map.setCenter(path[0]); map.setZoom(15); }
  else { map.setCenter({ lat: 48.14, lng: 11.58 }); map.setZoom(4); }
  map.addListener('idle', () => { if (mapObj === holder) ui.mapView = { key, c: map.getCenter().toJSON(), z: map.getZoom() }; });
}
async function initMap(tr) {
  if (mapObj) { mapObj.remove(); mapObj = null; }
  const box = $('#map');
  if (!box) return;
  const days = tripDays(tr), day = ui.mapDay || '', list = mapList(tr, day);
  // Jedes Zeichnen der Karte ist bei Google ein Kartenaufruf / 지도를 그릴 때마다 구글에서는 1번으로 셈
  if (useGoogle() && gmBudget('map', 100)) {
    try { await initGoogleMap(tr, box, list, day, days); return; } catch (e) { console.warn(e); ui.gmFailed = true; }
  }
  let L;
  try { L = await loadLeaflet(); } catch { box.innerHTML = `<p class="empty">${esc(t('mapFail'))}</p>`; return; }
  if (!document.body.contains(box)) return;
  const map = mapObj = L.map(box);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  const pts = [];
  list.forEach((x, i) => {
    const n = day ? i + 1 : (days.indexOf(x.date) + 1 || '·');
    const pin = L.divIcon({ className: '', html: `<div class="pin c-${x.cat || 'etc'}"><span>${n}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] });
    L.marker([x.loc.lat, x.loc.lng], { icon: pin, title: x.title }).addTo(map).bindPopup(popupHtml(x));
    pts.push([x.loc.lat, x.loc.lng]);
  });
  if (day && pts.length > 1) L.polyline(pts, { color: '#11777c', weight: 3, opacity: 0.7, dashArray: '6 7' }).addTo(map);
  const key = tr.id + '|' + day + '|' + list.length;
  const place = () => {
    if (ui.mapView && ui.mapView.key === key) map.setView(ui.mapView.c, ui.mapView.z);
    else if (pts.length) map.fitBounds(pts, { padding: [36, 36], maxZoom: 15 });
    else map.setView([48.14, 11.58], 4);
  };
  place();
  // Größe nach dem Einblenden neu messen (Safari) / 화면에 나온 뒤 크기를 다시 재기 (사파리)
  setTimeout(() => { if (mapObj === map) { map.invalidateSize(); place(); map.on('moveend', () => { ui.mapView = { key, c: map.getCenter(), z: map.getZoom() }; }); } }, 250);
}
async function findAll() {
  const tr = cur();
  if (ui.finding || !tr) return;
  const list = items(tr).filter((x) => !x.loc && x.cat !== 'move' && cleanName(x.title));
  ui.finding = true;
  const found = [], hits = [];
  let miss = 0;
  for (let i = 0; i < list.length; i++) {
    const b = $('#find-all');
    if (b) { b.textContent = t('finding', { a: i + 1, b: list.length }); b.disabled = true; }
    let hit = null;
    // Mitte der schon bekannten Orte; Treffer weiter als 150 km davon sind wohl gleichnamige Orte woanders
    // 이미 아는 곳들의 가운데. 거기서 150km보다 먼 결과는 이름만 같은 다른 곳일 가능성이 커서 버림
    const known = [...items(tr).filter((x) => x.loc && isFinite(x.loc.lat)).map((x) => x.loc), ...hits];
    const mid = known.length ? { lat: median(known.map((x) => x.lat)), lng: median(known.map((x) => x.lng)) } : null;
    for (const q of queriesFor(list[i]).slice(0, useGoogle() ? 2 : 5)) {
      await sleep(useGoogle() ? 150 : 1100); // Nominatim: höchstens eine Anfrage pro Sekunde / Nominatim은 1초에 한 번만
      try { [hit] = await geocode(q, tr, 1, hits); } catch (e) { console.warn(e); hit = null; }
      if (hit && mid && km(hit, mid) > 150) hit = null;
      if (hit) break;
    }
    if (hit) { hits.push(hit); found.push([['trips', tr.id, 'items', list[i].id, 'loc'], { lat: hit.lat, lng: hit.lng, name: shortName(hit.name), auto: true, ...(hit.pid && { pid: hit.pid }) }]); } else miss++;
  }
  ui.finding = false;
  if (found.length) write([...found, touch(tr.id)]); else render(true);
  toast(miss ? t('found', { a: found.length, b: miss }) : t('foundAll', { a: found.length }));
}

  const h3 = panel.querySelector('h3'), row = panel.querySelector('.sbar-row');

  row.innerHTML = `<button type="button" class="sb-l" data-act="close">${esc(form ? t('cancel') : t('close'))}</button><b class="sb-t"></b>${form ? `<button type="button" class="sb-r">${esc(t('save'))}</button>` : '<span></span>'}`;

// Ganz oben nach unten ziehen schließt das Blatt (wie bei iPhone-Apps) / 맨 위에서 아래로 쓸어내리면 닫힘
function dragToClose(panel) {
  let y0 = null, dy = 0;
  panel.addEventListener('touchstart', (e) => {
    y0 = panel.scrollTop <= 0 && !e.target.closest('input, textarea, select') ? e.touches[0].clientY : null;
    dy = 0;
  }, { passive: true });
  panel.addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || panel.scrollTop > 0) { panel.style.transform = ''; return; }
    e.preventDefault();
    panel.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  panel.addEventListener('touchend', () => {
    if (y0 == null) return;
    y0 = null;
    if (dy > 110) { closeSheet(); return; }
    panel.style.transition = 'transform .15s'; panel.style.transform = '';
    setTimeout(() => { panel.style.transition = ''; }, 160);
  });
}
function closeSheet() { sheetRoot.hidden = true; sheetRoot.innerHTML = ''; document.body.classList.remove('locked'); if (pending) render(); }

async function fetchRate(cur) {
  try {
    const r = await fetch(`https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(cur)}&symbols=EUR`);
    if (!r.ok) throw 0;
    const j = await r.json();
    return j.rates && j.rates.EUR ? +j.rates.EUR.toPrecision(5) : null;
  } catch { return null; }
}

  const list = data && data.trips && typeof data.trips === 'object' ? Object.values(data.trips).filter((x) => x && x.id && x.title) : [];

  toast(t('imported', { n: list.length }));

  const blob = new Blob([JSON.stringify({ app: 'travel', version: 1, exported: new Date().toISOString(), trips }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `travel-${today()}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ---------- Aktionen / 동작 ----------
const cur = () => trips[ui.trip];
const ACT = {
  lang: (b) => { ui.lang = b.dataset.l; store.put('lang', ui.lang); render(true); if (!sheetRoot.hidden) settingsSheet(); },
  settings: () => settingsSheet(),
  close: () => closeSheet(),
  home: () => go('#/'),
  open: (b) => go(`#/t/${b.dataset.id}`),
  tab: (b) => { ui.memoEdit = false; go(`#/t/${ui.trip}/${b.dataset.tab}`); },
  'new-trip': () => tripSheet(),
  'edit-trip': () => tripSheet(cur()),
  'del-trip': () => {
    const tr = cur();
    if (!confirm(t('delTripQ', { t: tr.title }))) return;
    closeSheet(); go('#/'); put(['trips', tr.id], null);
  },
  'new-item': (b) => {
    const tr = cur(), now = today();
    const day = b.dataset.day || (isDate(tr.start) && now >= tr.start && now <= (tr.end || tr.start) ? now : '');
    itemSheet(tr, null, { date: day, cat: b.dataset.cat });
  },
  'edit-item': (b) => itemSheet(cur(), cur().items[b.dataset.id]),
  'del-item': (b) => {
    const it = cur().items[b.dataset.id];
    if (!confirm(t('delItemQ', { t: it.title }))) return;
    write([[['trips', ui.trip, 'items', it.id], null], touch(ui.trip)]); closeSheet();
  },
  'toggle-book': (b) => { const it = cur().items[b.dataset.id]; write([[['trips', ui.trip, 'items', it.id, 'booked'], !it.booked], touch(ui.trip)]); },
  jump: (b) => { const el = document.getElementById('d-' + b.dataset.day); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  copy: async (b) => { try { await navigator.clipboard.writeText(b.dataset.v); toast(t('copied')); } catch {} },
  'fetch-rate': async () => {
    const tr = cur(), r = await fetchRate(tr.cur);
    if (r) { write([[['trips', tr.id, 'rate'], r], touch(tr.id)]); toast(t('rateOk')); } else toast(t('rateFail'));
  },
  check: (b) => { const x = cur().checks[b.dataset.id]; write([[['trips', ui.trip, 'checks', x.id, 'done'], !x.done], touch(ui.trip)]); },
  'rm-check': (b) => write([[['trips', ui.trip, 'checks', b.dataset.id], null], touch(ui.trip)]),
  'toggle-done': (b) => { const it = cur().items[b.dataset.id]; write([[['trips', ui.trip, 'items', it.id, 'done'], !it.done], touch(ui.trip)]); },
  'del-spend': (b) => { if (confirm(t('spendDelQ'))) write([[['trips', ui.trip, 'spend', b.dataset.id], null], touch(ui.trip)]); },
  'map-day': (b) => { ui.mapDay = b.dataset.day; render(true); },
  'find-all': () => findAll(),
  'cmp-kind': (b) => { ui.cmpKind = b.dataset.k; render(true); },
  grp: (b) => { ui.grp = b.dataset.g === '*' ? null : b.dataset.g; render(true); },
  'n-now': () => window.notionSync && window.notionSync.pull({ manual: true }),
  'n-full': () => { if (window.notionSync && confirm(t('nFullQ'))) window.notionSync.pull({ full: true, manual: true }); },
  'new-opt': () => optSheet(cur()),
  'edit-opt': (b) => optSheet(cur(), cur().opts[b.dataset.id]),
  'del-opt': (b) => {
    const tr = cur(), o = tr.opts[b.dataset.id];
    if (!confirm(t('delItemQ', { t: o.name }))) return;
    const entries = [[['trips', tr.id, 'opts', o.id], null], touch(tr.id)];
    const it = o.chosen && o.itemId && tr.items && tr.items[o.itemId];
    if (it && !it.booked) entries.push([['trips', tr.id, 'items', it.id], null]);
    write(entries); closeSheet();
  },
  choose: (b) => {
    const tr = cur(), o = tr.opts[b.dataset.id], entries = [touch(tr.id)];
    // Eine andere Wahl im selben Zeitraum aufheben (ungebuchte Einträge fallen weg)
    // 같은 기간에 이미 고른 후보가 있으면 취소 (예약 전이면 일정에서도 뺌)
    for (const p of optsOf(tr)) {
      if (p.id === o.id || !p.chosen || (p.kind || 'stay') !== (o.kind || 'stay') || p.start !== o.start || p.end !== o.end) continue;
      entries.push([['trips', tr.id, 'opts', p.id, 'chosen'], false]);
      const it = p.itemId && tr.items && tr.items[p.itemId];
      if (it && !it.booked) entries.push([['trips', tr.id, 'items', it.id], null]);
    }
    const [iid, entry] = optItemEntries(tr, o);
    entries.push(entry, [['trips', tr.id, 'opts', o.id, 'chosen'], true], [['trips', tr.id, 'opts', o.id, 'itemId'], iid]);
    write(entries);
    toast(t('addedToPlan'));
  },
  unchoose: (b) => {
    const tr = cur(), o = tr.opts[b.dataset.id], it = o.itemId && tr.items && tr.items[o.itemId];
    const entries = [[['trips', tr.id, 'opts', o.id, 'chosen'], false], touch(tr.id)];
    if (it && (!it.booked || confirm(t('keepBookedQ', { t: it.title })))) entries.push([['trips', tr.id, 'items', it.id], null]);
    write(entries);
    toast(t('removedFromPlan'));
  },
  tpl: (b) => {
    const tr = cur(), have = new Set(Object.values(tr.checks || {}).map((x) => x.text));
    const add = TPL[b.dataset.k][ui.lang].filter((s) => !have.has(s));
    const base = Date.now() / 1000;
    write([...add.map((text, i) => { const id = uid('c'); return [['trips', tr.id, 'checks', id], { id, text, done: false, order: base + i }]; }), touch(tr.id)]);
    toast(add.length ? t('addedN', { n: add.length }) : t('noneAdded'));
  },
  'memo-edit': () => { ui.memoEdit = true; render(true); const ta = $('textarea[name=memo]'); if (ta) ta.focus(); },
  'memo-cancel': () => { ui.memoEdit = false; render(true); },
  export: () => exportFile(),
  signin: async () => { const c = window.cloud; c.note = ''; try { await c.signIn(); } catch (e) { console.warn(e); c.note = t('signinFail'); } window.refreshSettings(); },
  signout: async () => { await window.cloud.signOut(); window.refreshSettings(); render(true); },
  'create-house': async () => { const c = window.cloud; c.note = ''; try { await c.create(); } catch (e) { console.warn(e); c.note = t('joinFail'); } window.refreshSettings(); },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || !ACT[b.dataset.act]) return;
  if (b.tagName === 'BUTTON' && b.type === 'submit' && b.form) return;
  e.preventDefault();
  ACT[b.dataset.act](b, e);
});
document.addEventListener('submit', async (e) => {
  const f = e.target, kind = f.dataset.form;
  if (kind === 'add-check') {
    e.preventDefault();
    const text = f.text.value.trim();
    if (!text) return;
    const id = uid('c');
    write([[['trips', ui.trip, 'checks', id], { id, text, done: false, order: Date.now() / 1000 }], touch(ui.trip)]);
    const input = $('form[data-form=add-check] input'); if (input) input.focus();
  } else if (kind === 'spend') {
    e.preventDefault();
    const amount = parseAmount(f.amount.value);
    if (!amount || isNaN(amount)) { f.amount.focus(); return; }
    ui.spendCur = f.cur.value; ui.spendCat = f.cat.value;
    const id = uid('s');
    write([[['trips', ui.trip, 'spend', id], { id, date: today(), amount, cur: f.cur.value, cat: f.cat.value || 'etc', title: f.title.value.trim(), t: Date.now() }], touch(ui.trip)]);
  } else if (kind === 'memo') {
    e.preventDefault();
    ui.memoEdit = false;
    write([[['trips', ui.trip, 'memo'], f.memo.value], touch(ui.trip)]);
  } else if (kind === 'join') {
    e.preventDefault();
    const c = window.cloud; c.note = '';
    try { if (!(await c.join(f.code.value))) c.note = t('badCode'); } catch (err) { console.warn(err); c.note = t('joinFail'); }
    window.refreshSettings();
  }
});
// iOS: kein Zoomen mit zwei Fingern / 두 손가락 확대 막기
document.addEventListener('gesturestart', (e) => e.preventDefault());

// ---------- Schnittstelle für die Synchronisierung / 동기화 연결부 ----------
window.travel = {
  trips: () => trips,
  setTrips(remote) { trips = remote || {}; persist(); if (ui.view === 'trip' && !valid(trips[ui.trip])) go('#/'); else render(); window.refreshSettings(); },
  unsynced: () => unsynced,
  clearUnsynced() { unsynced = new Set(); store.put('unsynced', []); },
  syncedHouse: () => store.get('house', null),
  setSyncedHouse: (h) => store.put('house', h),
  refresh() { render(); window.refreshSettings(); },
};
route();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
</script>
<script src="notion-sync.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
// ---------- 함께 보기 (Firebase) ----------
// Gleiches Firebase-Projekt und gleicher Familiencode wie 장보기/주간식단. Die Reisen liegen in einem eigenen
// Dokument households/{code}_travel, damit das gemeinsame Haushaltsdokument klein bleibt.
// 장보기·주간식단과 같은 Firebase, 같은 가족 코드. 여행은 따로 households/{코드}_travel 문서에 저장.
const cfg = window.FIREBASE_CONFIG, APP = window.travel;
if (cfg && APP) {
  const cloud = window.cloud = { ready: false, user: null, house: null, live: false, error: '', note: '' };
  let A, F, initializeApp;
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    [{ initializeApp }, A, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  } catch (e) {
    console.warn('firebase', e);
    cloud.ready = true; cloud.unavailable = true; APP.refresh();
  }
  if (A) {
    const fb = initializeApp(cfg), auth = A.getAuth(fb);
    const db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
    const tdoc = () => F.doc(db, 'households', cloud.house + '_travel');
    let unsub = null, retryTimer = 0, retries = 0;
    const msg = () => (document.documentElement.lang === 'de' ? 'Speichern fehlgeschlagen. Bitte Internetverbindung prüfen' : '서버에 저장하지 못했어요. 인터넷 연결을 확인해 주세요');
    const fail = (e) => { console.warn('sync', e); cloud.error = msg(); APP.refresh(); };
    const ok = () => { if (cloud.error) { cloud.error = ''; APP.refresh(); } };
    function stop() { if (unsub) unsub(); unsub = null; cloud.live = false; }

    cloud.write = (entries) => {
      const args = [];
      // JSON hin und zurück: Firestore lehnt "undefined" ab / Firestore는 undefined 값을 거부하므로 정리
      for (const [path, v] of entries) args.push(new F.FieldPath(...path), v == null ? F.deleteField() : JSON.parse(JSON.stringify(v)));
      return F.updateDoc(tdoc(), ...args).then(ok, fail);
    };

    function listen() {
      stop(); clearTimeout(retryTimer);
      let first = true, creating = false;
      unsub = F.onSnapshot(tdoc(), async (snap) => {
        if (!snap.exists()) {
          // Erstes Mal für diese Familie: Dokument anlegen / 이 가족의 첫 여행 문서 만들기
          if (!creating) { creating = true; try { await F.setDoc(tdoc(), { trips: {}, created: Date.now() }, { merge: true }); } catch (e) { fail(e); } }
          return;
        }
        retries = 0;
        const remote = snap.data().trips || {};
        if (first) {
          first = false;
          // Beim ersten Kontakt: Reisen, die nur hier liegen, mitnehmen; bei einem anderen Familiencode nichts mitnehmen.
          // 처음 연결: 이 기기에만 있는 여행을 올림. 다른 가족 코드로 옮길 때는 올리지 않음.
          const mine = APP.trips(), synced = APP.syncedHouse(), entries = [];
          const firstEver = !synced, same = synced === cloud.house, dirty = APP.unsynced();
          for (const id of Object.keys(mine)) {
            if (!mine[id] || !mine[id].title) continue;
            if ((firstEver && !remote[id]) || (same && dirty.has(id))) { entries.push([['trips', id], mine[id]]); remote[id] = mine[id]; }
          }
          if (same) for (const id of dirty) if (!mine[id] && remote[id]) { entries.push([['trips', id], null]); delete remote[id]; }
          APP.clearUnsynced(); APP.setSyncedHouse(cloud.house);
          if (entries.length) cloud.write(entries);
          cloud.live = true;
          if (window.notionSync) setTimeout(() => window.notionSync.start(), 500);
        }
        APP.setTrips(remote);
      }, (e) => {
        stop(); fail(e);
        retryTimer = setTimeout(() => { if (cloud.user && cloud.house) listen(); }, Math.min(120, 10 * ++retries) * 1000);
      });
    }
    async function link(code) {
      cloud.house = code;
      try { localStorage.setItem('travel-v1:lastHouse', JSON.stringify(code)); } catch {}
      await F.setDoc(F.doc(db, 'users', auth.currentUser.uid), { house: code }, { merge: true });
      listen(); APP.refresh();
    }
    cloud.idToken = () => auth.currentUser.getIdToken();
    cloud.signIn = () => A.signInWithPopup(auth, new A.GoogleAuthProvider());
    cloud.signOut = async () => { clearTimeout(retryTimer); stop(); cloud.house = null; await A.signOut(auth); APP.refresh(); };
    cloud.create = async () => {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map((n) => abc[n % abc.length]).join('');
      await F.setDoc(F.doc(db, 'households', code), { stores: {}, items: {}, stock: {}, meals: {}, created: Date.now() });
      await link(code);
    };
    cloud.join = async (raw) => {
      const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code || !(await F.getDoc(F.doc(db, 'households', code))).exists()) return false;
      await link(code);
      return true;
    };
    A.onAuthStateChanged(auth, async (user) => {
      cloud.user = user;
      if (!user) { stop(); cloud.house = null; }
      else if (!cloud.house) {
        try {
          const u = await F.getDoc(F.doc(db, 'users', user.uid));
          if (u.exists() && u.data().house) cloud.house = u.data().house;
        } catch (e) { console.warn('sync', e); }
        if (cloud.house) listen();
      }
      cloud.ready = true;
      APP.refresh();
    });
  }
}
</script>
